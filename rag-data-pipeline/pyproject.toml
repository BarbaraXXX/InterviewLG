[project]
name = "rag-data-pipeline"
version = "1.14.1"
description = "Offline interview QuestionCard extraction and preparation pipeline"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rag-data-pipeline = "rag_data_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_data_pipeline"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff==0.15.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

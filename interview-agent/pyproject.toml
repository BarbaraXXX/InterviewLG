[project]
name = "interview-agent"
version = "1.11.0"
description = "Mock technical interview agent built with LangGraph and MCP client"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-mcp-adapters>=0.2.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.0.0",
    "pyjwt>=2.0.0",
    "bcrypt>=5.0.0",
    "slowapi",
    "aiosqlite>=0.20.0",
    "tiktoken>=0.13.0",
    "dashscope>=1.24.0",
    "oss2>=2.19.0",
]

[project.scripts]
interview-agent = "interview_agent.main:main"
interview-agent-admin = "interview_agent.admin_cli:main"
interview-agent-server = "interview_agent.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_agent"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
